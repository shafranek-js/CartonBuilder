name: CartonBuilder Quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Run Render reliability browser gate (visual baselines)
        run: npm run test:visual -- --workers=1

      - name: Run Chromium smoke workflows
        run: npm run test:e2e:smoke

      - name: Upload Chromium smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cartonbuilder-chromium-test-results
          path: test-results/
          if-no-files-found: ignore

  chromium:
    name: Chromium E2E ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            files: tests/e2e/app.spec.js tests/e2e/artwork-crop.spec.js
          - suite: preview
            files: tests/e2e/construction.spec.js tests/e2e/first-run-example.spec.js tests/e2e/preview3d.spec.js
          - suite: render
            files: tests/e2e/render.spec.js
          - suite: prepress
            files: tests/e2e/overprint.spec.js tests/e2e/pdf-layers.spec.js tests/e2e/prepress.spec.js
          - suite: support
            files: tests/e2e/renderSettingsSnapshot.spec.js tests/e2e/showcase.spec.js

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run full Chromium E2E suite group
        run: npm run test:e2e:ci:fast -- ${{ matrix.files }} --workers=1

      - name: Upload Chromium shard artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cartonbuilder-chromium-${{ matrix.suite }}-results
          path: test-results/
          if-no-files-found: ignore

  stress:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Render and Preview stress coverage
        run: npm run test:e2e:stress

      - name: Upload stress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cartonbuilder-stress-test-results
          path: test-results/
          if-no-files-found: ignore

  edge:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Microsoft Edge
        run: npx playwright install msedge

      - name: Run full Edge E2E suite
        run: npm run test:e2e:edge

      - name: Upload Edge browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cartonbuilder-edge-test-results
          path: test-results/
          if-no-files-found: ignore
