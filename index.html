<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive rectangular box net builder">
  <title>Create Basic Box</title>
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="title-bar">Create Basic Box</header>

    <section class="app-content">
      <fieldset class="dimensions-fieldset">
        <legend>Box Dimensions</legend>
        <div class="dimension-list">
          <div class="dimension-row">
            <label for="boxWidth">Width:</label>
            <span class="measure-input">
              <input id="boxWidth" name="width" type="number" min="0.1" step="0.1" value="150" inputmode="decimal">
            </span>
            <svg class="dimension-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8 12 4l7 4v8l-7 4-7-4Z M5 8l7 4 7-4M12 12v8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
          <div class="dimension-row">
            <label for="boxHeight">Height:</label>
            <span class="measure-input">
              <input id="boxHeight" name="height" type="number" min="0.1" step="0.1" value="90" inputmode="decimal">
            </span>
            <svg class="dimension-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8 12 4l7 4v8l-7 4-7-4Z M5 8l7 4 7-4M12 12v8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
          <div class="dimension-row">
            <label for="boxDepth">Depth:</label>
            <span class="measure-input">
              <input id="boxDepth" name="depth" type="number" min="0.1" step="0.1" value="40" inputmode="decimal">
            </span>
            <svg class="dimension-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8 12 4l7 4v8l-7 4-7-4Z M5 8l7 4 7-4M12 12v8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
        </div>
      </fieldset>

      <section class="designer" aria-label="Box net designer">
        <div class="designer-heading">
          <span>Design your box by adding or removing box panels</span>
          <span class="placed-count">Placed panels: <strong id="panelCount">1/6</strong></span>
        </div>
        <div class="workspace-wrap">
          <svg id="workspace" role="img" aria-label="Interactive box net"></svg>
        </div>
      </section>

      <footer class="app-footer">
        <button class="footer-button continue-button" id="continueButton" type="button" disabled>Continue</button>
        <button class="footer-button cancel-button" id="cancelButton" type="button">Cancel</button>
      </footer>

      <div class="dialog-backdrop" id="resultBackdrop" hidden>
        <section class="result-dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultDescription">
          <h2 id="resultTitle">Basic box created</h2>
          <p id="resultDescription">The box net contains all six panels and is ready for the next workflow step.</p>
          <div class="dialog-summary" id="dialogSummary"></div>
          <div class="dialog-actions">
            <button class="dialog-button" id="closeDialogButton" type="button">Back</button>
            <button class="dialog-button primary" id="exportButton" type="button">Export SVG</button>
          </div>
        </section>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
