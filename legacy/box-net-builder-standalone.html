<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Basic Box</title>
  <style>
:root {
  color-scheme: light;
  --frame-border: #70817c;
  --header-bg: #eef5f3;
  --surface: #535353;
  --surface-dark: #494949;
  --workspace: #ffffff;
  --text: #ffffff;
  --muted: #d9d9d9;
  --line: #101010;
  --front: #b7dcef;
  --base: #efa6ec;
  --panel: #ffffff;
  --accent: #afca42;
  --accent-hover: #bfd956;
  --disabled: #666666;
  --focus: #d8ef79;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-width: 320px;
  height: 100%;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  padding: 12px;
  overflow: hidden;
  background: #343434;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
}

button,
input {
  font: inherit;
}

.app-shell {
  display: grid;
  grid-template-rows: 32px minmax(0, 1fr);
  width: min(1020px, 100%);
  height: min(760px, calc(100vh - 24px));
  min-height: 560px;
  overflow: hidden;
  border: 1px solid var(--frame-border);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: 0 18px 55px rgb(0 0 0 / 30%);
}

.title-bar {
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid #b7c6c2;
  background: var(--header-bg);
  color: #111111;
  font-size: 13px;
}

.app-content {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) 50px;
  min-height: 0;
  padding: 14px 16px 0;
  background: var(--surface);
  color: var(--text);
}

.dimensions-fieldset {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  min-height: 118px;
  margin: 0 0 10px;
  padding: 13px 12px 11px;
  border: 1px solid #484848;
}

.dimensions-fieldset legend {
  padding: 0 8px;
  color: #ffffff;
  font-size: 13px;
}

.dimension-list {
  grid-column: 2;
  display: grid;
  gap: 10px;
  min-width: 210px;
}

.dimension-row {
  display: grid;
  grid-template-columns: 62px 82px 24px;
  align-items: center;
  gap: 7px;
}

.dimension-row label {
  text-align: right;
}

.measure-input {
  position: relative;
}

.measure-input input {
  width: 100%;
  height: 24px;
  padding: 2px 28px 2px 6px;
  border: 1px solid #3b3b3b;
  border-radius: 2px;
  outline: none;
  background: #eeeeee;
  color: #1d1d1d;
}

.measure-input::after {
  position: absolute;
  top: 50%;
  right: 7px;
  content: "mm";
  transform: translateY(-50%);
  color: #444444;
  font-size: 11px;
  pointer-events: none;
}

.measure-input input:focus {
  border-color: var(--focus);
  box-shadow: 0 0 0 2px rgb(216 239 121 / 28%);
}

.dimension-icon {
  width: 18px;
  height: 18px;
  color: #e9f3f1;
}

.designer {
  display: grid;
  grid-template-rows: 24px minmax(0, 1fr);
  min-height: 0;
}

.designer-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: #ffffff;
  font-size: 12px;
}

.placed-count {
  white-space: nowrap;
}

.workspace-wrap {
  position: relative;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #4c4c4c;
  background: var(--workspace);
}

#workspace {
  display: block;
  width: 100%;
  height: 100%;
  background: #ffffff;
  touch-action: manipulation;
}

.panel-hitbox {
  fill: transparent;
  pointer-events: all;
}

.panel-shape {
  stroke: var(--line);
  fill: var(--panel);
  shape-rendering: geometricPrecision;
}

.panel-front .panel-shape {
  fill: var(--front);
}

.panel-bottom .panel-shape {
  fill: var(--base);
}

.panel-label {
  fill: #101010;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  user-select: none;
}

.edge-action,
.remove-action {
  cursor: pointer;
}

.edge-action {
  opacity: 0;
  transition: opacity 120ms ease;
}

.panel-group:hover .edge-action,
.panel-group:focus-within .edge-action,
.edge-action:focus {
  opacity: 1;
}

.action-circle {
  fill: #ffffff;
  stroke: #5f676a;
  transition: fill 100ms ease, stroke 100ms ease;
}

.edge-action:hover .action-circle,
.edge-action:focus .action-circle {
  fill: #f0f7d1;
  stroke: #788e1b;
}

.remove-action:hover .action-circle,
.remove-action:focus .action-circle {
  fill: #ffe8e8;
  stroke: #9d4141;
}

.action-line {
  stroke: #50585b;
  stroke-linecap: round;
  pointer-events: none;
}

.edge-action:hover .action-line,
.edge-action:focus .action-line {
  stroke: #536600;
}

.remove-action:hover .action-line,
.remove-action:focus .action-line {
  stroke: #8a2525;
}

.edge-action:focus,
.remove-action:focus {
  outline: none;
}

.app-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  padding: 8px 0 10px;
}

.footer-button {
  min-width: 112px;
  height: 32px;
  padding: 0 20px;
  border: 1px solid transparent;
  border-radius: 18px;
  cursor: pointer;
}

.footer-button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.continue-button {
  border-color: #8b8b8b;
  background: #4d4d4d;
  color: #ffffff;
}

.continue-button:disabled {
  border-color: #777777;
  background: #565656;
  color: #919191;
  cursor: default;
}

.cancel-button {
  background: var(--accent);
  color: #ffffff;
}

.cancel-button:hover {
  background: var(--accent-hover);
}

.dialog-backdrop {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgb(0 0 0 / 38%);
}

.dialog-backdrop[hidden] {
  display: none;
}

.result-dialog {
  width: min(430px, 100%);
  padding: 22px;
  border: 1px solid #84948f;
  border-radius: 8px;
  background: #f5f8f7;
  color: #1b1b1b;
  box-shadow: 0 16px 50px rgb(0 0 0 / 32%);
}

.result-dialog h2 {
  margin: 0 0 8px;
  font-size: 18px;
}

.result-dialog p {
  margin: 0 0 16px;
  line-height: 1.45;
}

.dialog-summary {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 18px;
  margin-bottom: 18px;
  padding: 12px;
  border-radius: 5px;
  background: #e5ecea;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.dialog-button {
  height: 32px;
  padding: 0 16px;
  border: 1px solid #788681;
  border-radius: 16px;
  cursor: pointer;
}

.dialog-button.primary {
  border-color: #91aa24;
  background: var(--accent);
  color: #ffffff;
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 62px;
  z-index: 20;
  padding: 9px 14px;
  border-radius: 18px;
  opacity: 0;
  transform: translate(-50%, 10px);
  background: rgb(32 32 32 / 90%);
  color: #ffffff;
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
}

.toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (hover: none) {
  .edge-action {
    opacity: 1;
  }
}

@media (max-width: 620px) {
  body {
    padding: 0;
  }

  .app-shell {
    width: 100%;
    height: 100%;
    min-height: 0;
    border-radius: 0;
  }

  .app-content {
    padding-inline: 10px;
  }

  .dimensions-fieldset {
    grid-template-columns: 1fr;
  }

  .dimension-list {
    grid-column: 1;
    justify-self: center;
  }
}

</style>
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="title-bar">Create Basic Box</header>

    <section class="app-content">
      <fieldset class="dimensions-fieldset">
        <legend>Box Dimensions</legend>
        <div class="dimension-list">
          <div class="dimension-row">
            <label for="boxWidth">Width:</label>
            <span class="measure-input">
              <input id="boxWidth" name="width" type="number" min="0.1" step="0.1" value="150" inputmode="decimal">
            </span>
            <svg class="dimension-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8 12 4l7 4v8l-7 4-7-4Z M5 8l7 4 7-4M12 12v8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
          <div class="dimension-row">
            <label for="boxHeight">Height:</label>
            <span class="measure-input">
              <input id="boxHeight" name="height" type="number" min="0.1" step="0.1" value="90" inputmode="decimal">
            </span>
            <svg class="dimension-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8 12 4l7 4v8l-7 4-7-4Z M5 8l7 4 7-4M12 12v8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
          <div class="dimension-row">
            <label for="boxDepth">Depth:</label>
            <span class="measure-input">
              <input id="boxDepth" name="depth" type="number" min="0.1" step="0.1" value="40" inputmode="decimal">
            </span>
            <svg class="dimension-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8 12 4l7 4v8l-7 4-7-4Z M5 8l7 4 7-4M12 12v8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
        </div>
      </fieldset>

      <section class="designer" aria-label="Box net designer">
        <div class="designer-heading">
          <span>Design your box by adding or removing box panels</span>
          <span class="placed-count">Placed panels: <strong id="panelCount">1/6</strong></span>
        </div>
        <div class="workspace-wrap">
          <svg id="workspace" role="img" aria-label="Interactive box net"></svg>
        </div>
      </section>

      <footer class="app-footer">
        <button class="footer-button continue-button" id="continueButton" type="button" disabled>Continue</button>
        <button class="footer-button cancel-button" id="cancelButton" type="button">Cancel</button>
      </footer>

      <div class="dialog-backdrop" id="resultBackdrop" hidden>
        <section class="result-dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
          <h2 id="resultTitle">Basic box created</h2>
          <p>The box net contains all six panels and is ready for the next workflow step.</p>
          <div class="dialog-summary" id="dialogSummary"></div>
          <div class="dialog-actions">
            <button class="dialog-button" id="closeDialogButton" type="button">Back</button>
            <button class="dialog-button primary" id="exportButton" type="button">Export SVG</button>
          </div>
        </section>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) {
    module.exports = api;
  } else {
    root.BoxNet = api;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const EDGES = ['top', 'right', 'bottom', 'left'];
  const OPPOSITE_EDGE = {
    top: 'bottom',
    right: 'left',
    bottom: 'top',
    left: 'right',
  };

  const FACE_BY_NORMAL = {
    '0,0,1': { key: 'front', name: 'Front Panel' },
    '0,0,-1': { key: 'back', name: 'Back Panel' },
    '0,1,0': { key: 'top', name: 'Top Panel' },
    '0,-1,0': { key: 'bottom', name: 'Base Panel' },
    '-1,0,0': { key: 'left', name: 'Left Panel' },
    '1,0,0': { key: 'right', name: 'Right Panel' },
  };

  function vectorKey(vector) {
    return vector.join(',');
  }

  function negate(vector) {
    return vector.map((value) => -value);
  }

  function cloneVector(vector) {
    return vector.slice();
  }

  function getAxisDimension(vector, dimensions) {
    if (Math.abs(vector[0]) === 1) return dimensions.width;
    if (Math.abs(vector[1]) === 1) return dimensions.height;
    if (Math.abs(vector[2]) === 1) return dimensions.depth;
    throw new Error(`Invalid axis vector: ${vectorKey(vector)}`);
  }

  function getAdjacentBasis(panel, edge) {
    const { normal, up, right } = panel.basis;

    switch (edge) {
      case 'top':
        return {
          normal: cloneVector(up),
          up: negate(normal),
          right: cloneVector(right),
        };
      case 'bottom':
        return {
          normal: negate(up),
          up: cloneVector(normal),
          right: cloneVector(right),
        };
      case 'right':
        return {
          normal: cloneVector(right),
          up: cloneVector(up),
          right: negate(normal),
        };
      case 'left':
        return {
          normal: negate(right),
          up: cloneVector(up),
          right: cloneVector(normal),
        };
      default:
        throw new Error(`Unknown edge: ${edge}`);
    }
  }

  function getPlacedRectangle(panel, edge, width, height) {
    switch (edge) {
      case 'top':
        return { x: panel.x, y: panel.y - height, width, height };
      case 'right':
        return { x: panel.x + panel.width, y: panel.y, width, height };
      case 'bottom':
        return { x: panel.x, y: panel.y + panel.height, width, height };
      case 'left':
        return { x: panel.x - width, y: panel.y, width, height };
      default:
        throw new Error(`Unknown edge: ${edge}`);
    }
  }

  function rectanglesOverlap(a, b, epsilon = 1e-7) {
    return (
      a.x < b.x + b.width - epsilon &&
      a.x + a.width > b.x + epsilon &&
      a.y < b.y + b.height - epsilon &&
      a.y + a.height > b.y + epsilon
    );
  }

  function normalizeDimensions(dimensions) {
    const result = {
      width: Number(dimensions.width),
      height: Number(dimensions.height),
      depth: Number(dimensions.depth),
    };

    for (const [name, value] of Object.entries(result)) {
      if (!Number.isFinite(value) || value <= 0) {
        throw new Error(`${name} must be a positive number.`);
      }
      if (value > 100000) {
        throw new Error(`${name} is too large.`);
      }
    }

    return result;
  }

  class BoxNetModel {
    constructor(dimensions = { width: 150, height: 90, depth: 40 }) {
      this.reset(dimensions);
    }

    reset(dimensions = this.dimensions) {
      this.dimensions = normalizeDimensions(dimensions);
      this.panels = new Map();
      this.creationSequence = 0;

      const front = this._createPanel({
        faceKey: 'front',
        faceName: 'Front Panel',
        basis: {
          normal: [0, 0, 1],
          up: [0, 1, 0],
          right: [1, 0, 0],
        },
        x: 0,
        y: 0,
        parentId: null,
        parentEdge: null,
      });

      this.rootId = front.id;
      return this;
    }

    _createPanel({ faceKey, faceName, basis, x, y, parentId, parentEdge }) {
      const width = getAxisDimension(basis.right, this.dimensions);
      const height = getAxisDimension(basis.up, this.dimensions);
      const panel = {
        id: faceKey,
        faceKey,
        faceName,
        basis: {
          normal: cloneVector(basis.normal),
          up: cloneVector(basis.up),
          right: cloneVector(basis.right),
        },
        x,
        y,
        width,
        height,
        parentId,
        parentEdge,
        order: this.creationSequence++,
        links: {
          top: null,
          right: null,
          bottom: null,
          left: null,
        },
      };

      this.panels.set(panel.id, panel);
      return panel;
    }

    getPanel(panelId) {
      return this.panels.get(panelId) || null;
    }

    getPanels() {
      return Array.from(this.panels.values()).sort((a, b) => a.order - b.order);
    }

    get panelCount() {
      return this.panels.size;
    }

    get isComplete() {
      return this.panelCount === 6;
    }

    getChildren(panelId) {
      return this.getPanels().filter((panel) => panel.parentId === panelId);
    }

    canDelete(panelId) {
      if (panelId === this.rootId) return false;
      return this.getChildren(panelId).length === 0;
    }

    getPotential(panelId, edge) {
      if (!EDGES.includes(edge)) return null;
      const panel = this.getPanel(panelId);
      if (!panel || panel.links[edge]) return null;

      const basis = getAdjacentBasis(panel, edge);
      const face = FACE_BY_NORMAL[vectorKey(basis.normal)];
      if (!face || this.panels.has(face.key)) return null;

      const width = getAxisDimension(basis.right, this.dimensions);
      const height = getAxisDimension(basis.up, this.dimensions);
      const rectangle = getPlacedRectangle(panel, edge, width, height);

      const collides = this.getPanels().some((existing) =>
        rectanglesOverlap(rectangle, existing),
      );
      if (collides) return null;

      return {
        faceKey: face.key,
        faceName: face.name,
        basis,
        ...rectangle,
      };
    }

    getEligibleEdges(panelId) {
      return EDGES.filter((edge) => Boolean(this.getPotential(panelId, edge)));
    }

    addPanel(panelId, edge) {
      const parent = this.getPanel(panelId);
      const potential = this.getPotential(panelId, edge);
      if (!parent || !potential) return null;

      const child = this._createPanel({
        faceKey: potential.faceKey,
        faceName: potential.faceName,
        basis: potential.basis,
        x: potential.x,
        y: potential.y,
        parentId: parent.id,
        parentEdge: edge,
      });

      parent.links[edge] = child.id;
      child.links[OPPOSITE_EDGE[edge]] = parent.id;
      return child;
    }

    deletePanel(panelId) {
      const panel = this.getPanel(panelId);
      if (!panel || !this.canDelete(panelId)) return false;

      const parent = this.getPanel(panel.parentId);
      if (parent && panel.parentEdge) {
        parent.links[panel.parentEdge] = null;
      }

      this.panels.delete(panelId);
      return true;
    }

    getBounds() {
      const panels = this.getPanels();
      if (panels.length === 0) {
        return { minX: 0, minY: 0, maxX: 1, maxY: 1, width: 1, height: 1 };
      }

      const minX = Math.min(...panels.map((panel) => panel.x));
      const minY = Math.min(...panels.map((panel) => panel.y));
      const maxX = Math.max(...panels.map((panel) => panel.x + panel.width));
      const maxY = Math.max(...panels.map((panel) => panel.y + panel.height));

      return {
        minX,
        minY,
        maxX,
        maxY,
        width: maxX - minX,
        height: maxY - minY,
      };
    }

    toJSON() {
      return {
        dimensions: { ...this.dimensions },
        complete: this.isComplete,
        panels: this.getPanels().map((panel) => ({
          id: panel.id,
          name: panel.faceName,
          x: panel.x,
          y: panel.y,
          width: panel.width,
          height: panel.height,
          parentId: panel.parentId,
          parentEdge: panel.parentEdge,
          basis: {
            normal: cloneVector(panel.basis.normal),
            up: cloneVector(panel.basis.up),
            right: cloneVector(panel.basis.right),
          },
        })),
      };
    }
  }

  return {
    BoxNetModel,
    EDGES,
    OPPOSITE_EDGE,
    FACE_BY_NORMAL,
    getAdjacentBasis,
    rectanglesOverlap,
  };
});

</script>
  <script>
(function () {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const model = new BoxNet.BoxNetModel({ width: 150, height: 90, depth: 40 });

  const svg = document.getElementById('workspace');
  const panelCount = document.getElementById('panelCount');
  const continueButton = document.getElementById('continueButton');
  const cancelButton = document.getElementById('cancelButton');
  const resultBackdrop = document.getElementById('resultBackdrop');
  const closeDialogButton = document.getElementById('closeDialogButton');
  const exportButton = document.getElementById('exportButton');
  const dialogSummary = document.getElementById('dialogSummary');
  const toast = document.getElementById('toast');
  const dimensionInputs = {
    width: document.getElementById('boxWidth'),
    height: document.getElementById('boxHeight'),
    depth: document.getElementById('boxDepth'),
  };

  let lastDimensions = { ...model.dimensions };
  let toastTimer = null;

  function createSvgElement(name, attributes = {}) {
    const element = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attributes)) {
      element.setAttribute(key, String(value));
    }
    return element;
  }

  function formatNumber(value) {
    return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(2)));
  }

  function showToast(message) {
    window.clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add('visible');
    toastTimer = window.setTimeout(() => toast.classList.remove('visible'), 1800);
  }

  function readDimensions() {
    return {
      width: Number(dimensionInputs.width.value),
      height: Number(dimensionInputs.height.value),
      depth: Number(dimensionInputs.depth.value),
    };
  }

  function restoreDimensionInputs() {
    for (const [key, input] of Object.entries(dimensionInputs)) {
      input.value = formatNumber(lastDimensions[key]);
    }
  }

  function applyDimensionChange() {
    const nextDimensions = readDimensions();
    try {
      const hasAddedPanels = model.panelCount > 1;
      const changed = Object.keys(nextDimensions).some(
        (key) => nextDimensions[key] !== lastDimensions[key],
      );
      if (!changed) return;

      if (hasAddedPanels) {
        const shouldReset = window.confirm(
          'Changing the box dimensions will reset the current panel layout. Continue?',
        );
        if (!shouldReset) {
          restoreDimensionInputs();
          return;
        }
      }

      model.reset(nextDimensions);
      lastDimensions = { ...model.dimensions };
      render();
    } catch (error) {
      restoreDimensionInputs();
      showToast(error.message || 'Enter valid positive dimensions.');
    }
  }

  function getViewMetrics() {
    const bounds = model.getBounds();
    const maxDimension = Math.max(bounds.width, bounds.height);
    const paddingFactor = Math.min(0.3, 0.18 + model.panelCount * 0.02);
    const padding = Math.max(16, maxDimension * paddingFactor);
    const view = {
      x: bounds.minX - padding,
      y: bounds.minY - padding,
      width: bounds.width + padding * 2,
      height: bounds.height + padding * 2,
    };

    const pixelWidth = Math.max(svg.clientWidth, 1);
    const pixelHeight = Math.max(svg.clientHeight, 1);
    const scale = Math.max(0.0001, Math.min(pixelWidth / view.width, pixelHeight / view.height));
    const unitPerPixel = 1 / scale;

    return {
      bounds,
      view,
      scale,
      unitPerPixel,
      strokeWidth: unitPerPixel,
      fontSize: 12 * unitPerPixel,
      buttonRadius: 7 * unitPerPixel,
      buttonOffset: 10 * unitPerPixel,
      actionStroke: 1.2 * unitPerPixel,
      hitPadding: 18 * unitPerPixel,
    };
  }

  function getEdgeCenter(panel, edge, offset) {
    switch (edge) {
      case 'top':
        return { x: panel.x + panel.width / 2, y: panel.y - offset };
      case 'right':
        return { x: panel.x + panel.width + offset, y: panel.y + panel.height / 2 };
      case 'bottom':
        return { x: panel.x + panel.width / 2, y: panel.y + panel.height + offset };
      case 'left':
        return { x: panel.x - offset, y: panel.y + panel.height / 2 };
      default:
        throw new Error(`Unknown edge: ${edge}`);
    }
  }

  function appendActionButton({ group, x, y, radius, strokeWidth, type, label, onActivate }) {
    const action = createSvgElement('g', {
      class: type === 'plus' ? 'edge-action plus-action' : 'remove-action',
      role: 'button',
      tabindex: '0',
      'aria-label': label,
      transform: `translate(${x} ${y})`,
    });

    const title = createSvgElement('title');
    title.textContent = label;
    action.appendChild(title);

    action.appendChild(createSvgElement('circle', {
      class: 'action-circle',
      cx: 0,
      cy: 0,
      r: radius,
      'stroke-width': strokeWidth,
    }));

    const arm = radius * 0.48;
    action.appendChild(createSvgElement('line', {
      class: 'action-line',
      x1: -arm,
      y1: 0,
      x2: arm,
      y2: 0,
      'stroke-width': strokeWidth,
    }));

    if (type === 'plus') {
      action.appendChild(createSvgElement('line', {
        class: 'action-line',
        x1: 0,
        y1: -arm,
        x2: 0,
        y2: arm,
        'stroke-width': strokeWidth,
      }));
    }

    action.addEventListener('click', (event) => {
      event.stopPropagation();
      onActivate();
    });
    action.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        onActivate();
      }
    });

    group.appendChild(action);
  }

  function renderPanel(panel, metrics) {
    const group = createSvgElement('g', {
      class: `panel-group panel-${panel.faceKey}`,
      'data-panel-id': panel.id,
    });

    group.appendChild(createSvgElement('rect', {
      class: 'panel-hitbox',
      x: panel.x - metrics.hitPadding,
      y: panel.y - metrics.hitPadding,
      width: panel.width + metrics.hitPadding * 2,
      height: panel.height + metrics.hitPadding * 2,
    }));

    const panelTitle = createSvgElement('title');
    panelTitle.textContent = `${panel.faceName}: ${formatNumber(panel.width)} × ${formatNumber(panel.height)} mm`;
    group.appendChild(panelTitle);

    group.appendChild(createSvgElement('rect', {
      class: 'panel-shape',
      x: panel.x,
      y: panel.y,
      width: panel.width,
      height: panel.height,
      'stroke-width': metrics.strokeWidth,
    }));

    if (panel.faceKey === 'front' || panel.faceKey === 'bottom') {
      const labelY = panel.faceKey === 'bottom'
        ? panel.y + panel.height * 0.66
        : panel.y + panel.height / 2;
      const label = createSvgElement('text', {
        class: 'panel-label',
        x: panel.x + panel.width / 2,
        y: labelY,
        'font-size': metrics.fontSize,
      });
      label.textContent = panel.faceName;
      group.appendChild(label);
    }

    if (model.canDelete(panel.id)) {
      const removeY = panel.faceKey === 'bottom'
        ? panel.y + panel.height * 0.31
        : panel.y + panel.height / 2;
      appendActionButton({
        group,
        x: panel.x + panel.width / 2,
        y: removeY,
        radius: metrics.buttonRadius,
        strokeWidth: metrics.actionStroke,
        type: 'minus',
        label: `Remove ${panel.faceName}`,
        onActivate: () => {
          model.deletePanel(panel.id);
          render();
        },
      });
    }

    for (const edge of model.getEligibleEdges(panel.id)) {
      const point = getEdgeCenter(panel, edge, metrics.buttonOffset);
      const potential = model.getPotential(panel.id, edge);
      appendActionButton({
        group,
        x: point.x,
        y: point.y,
        radius: metrics.buttonRadius,
        strokeWidth: metrics.actionStroke,
        type: 'plus',
        label: `Add ${potential.faceName} to the ${edge} edge of ${panel.faceName}`,
        onActivate: () => {
          model.addPanel(panel.id, edge);
          render();
        },
      });
    }

    svg.appendChild(group);
  }

  function render() {
    const metrics = getViewMetrics();
    svg.replaceChildren();
    svg.setAttribute(
      'viewBox',
      `${metrics.view.x} ${metrics.view.y} ${metrics.view.width} ${metrics.view.height}`,
    );

    for (const panel of model.getPanels()) {
      renderPanel(panel, metrics);
    }

    panelCount.textContent = `${model.panelCount}/6`;
    continueButton.disabled = !model.isComplete;
    svg.setAttribute(
      'aria-label',
      `Interactive box net with ${model.panelCount} of 6 panels placed`,
    );
  }

  function createExportSvg() {
    const bounds = model.getBounds();
    const padding = Math.max(5, Math.max(bounds.width, bounds.height) * 0.03);
    const x = bounds.minX - padding;
    const y = bounds.minY - padding;
    const width = bounds.width + padding * 2;
    const height = bounds.height + padding * 2;
    const strokeWidth = Math.max(0.2, Math.max(bounds.width, bounds.height) / 900);
    const fontSize = Math.max(3, Math.max(bounds.width, bounds.height) / 32);

    const panelMarkup = model.getPanels().map((panel) => {
      const fill = panel.faceKey === 'front'
        ? '#b7dcef'
        : panel.faceKey === 'bottom'
          ? '#efa6ec'
          : '#ffffff';
      const label = panel.faceKey === 'front' || panel.faceKey === 'bottom'
        ? `<text x="${panel.x + panel.width / 2}" y="${panel.y + panel.height / 2}" font-family="Arial, Helvetica, sans-serif" font-size="${fontSize}" text-anchor="middle" dominant-baseline="middle" fill="#101010">${panel.faceName}</text>`
        : '';
      return `<g><title>${panel.faceName}: ${formatNumber(panel.width)} × ${formatNumber(panel.height)} mm</title><rect x="${panel.x}" y="${panel.y}" width="${panel.width}" height="${panel.height}" fill="${fill}" stroke="#101010" stroke-width="${strokeWidth}"/>${label}</g>`;
    }).join('');

    return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${width} ${height}" width="${width}mm" height="${height}mm">${panelMarkup}</svg>`;
  }

  function exportSvg() {
    const content = createExportSvg();
    const blob = new Blob([content], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    const { width, height, depth } = model.dimensions;
    anchor.href = url;
    anchor.download = `box-net-${formatNumber(width)}x${formatNumber(height)}x${formatNumber(depth)}mm.svg`;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    URL.revokeObjectURL(url);
  }

  function openResultDialog() {
    if (!model.isComplete) return;

    const { width, height, depth } = model.dimensions;
    dialogSummary.replaceChildren();
    const rows = [
      ['Width', `${formatNumber(width)} mm`],
      ['Height', `${formatNumber(height)} mm`],
      ['Depth', `${formatNumber(depth)} mm`],
      ['Panels', '6 / 6'],
    ];
    for (const [label, value] of rows) {
      const labelElement = document.createElement('span');
      labelElement.textContent = label;
      const valueElement = document.createElement('strong');
      valueElement.textContent = value;
      dialogSummary.append(labelElement, valueElement);
    }

    resultBackdrop.hidden = false;
    exportButton.focus();
    window.dispatchEvent(new CustomEvent('box-net-complete', { detail: model.toJSON() }));
  }

  function closeResultDialog() {
    resultBackdrop.hidden = true;
    continueButton.focus();
  }

  Object.values(dimensionInputs).forEach((input) => {
    input.addEventListener('change', applyDimensionChange);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        input.blur();
      }
    });
  });

  continueButton.addEventListener('click', openResultDialog);
  closeDialogButton.addEventListener('click', closeResultDialog);
  exportButton.addEventListener('click', exportSvg);
  resultBackdrop.addEventListener('click', (event) => {
    if (event.target === resultBackdrop) closeResultDialog();
  });

  cancelButton.addEventListener('click', () => {
    if (model.panelCount > 1 && !window.confirm('Reset the current box layout?')) return;
    model.reset(lastDimensions);
    render();
    showToast('The box layout was reset.');
    window.dispatchEvent(new CustomEvent('box-net-cancelled'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !resultBackdrop.hidden) closeResultDialog();
  });

  const workspaceWrap = document.querySelector('.workspace-wrap');
  const resizeObserver = new ResizeObserver(() => render());
  resizeObserver.observe(workspaceWrap);

  // Small integration surface for a host application and automated tests.
  window.boxNetApp = {
    model,
    render,
    addPanel(panelId, edge) {
      const result = model.addPanel(panelId, edge);
      render();
      return result;
    },
    deletePanel(panelId) {
      const result = model.deletePanel(panelId);
      render();
      return result;
    },
    reset(dimensions) {
      model.reset(dimensions || lastDimensions);
      lastDimensions = { ...model.dimensions };
      restoreDimensionInputs();
      render();
    },
    getState() {
      return model.toJSON();
    },
  };

  requestAnimationFrame(render);
})();

</script>
</body>
</html>
